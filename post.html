<body>
<nav class="navbar">

<main class="page-body">
  <div class="post-hero" id="post-hero">
    <div class="container">
      <a href="blog.html" style="color:rgba(255,255,255,0.5); font-size:0.85rem; display:inline-block; margin-bottom:20px;">← Back to Blog</a>
      <h1 id="post-title">Loading...</h1>
      <div class="post-meta-bar">
        <span id="post-date"></span>
        <span id="post-tags"></span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="post-body" id="post-content">
    </div>
    <div style="margin-top:48px; padding-top:32px; border-top:1px solid var(--border); text-align:center;">
      <a href="blog.html" class="btn btn-navy">← Back to All Posts</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">

  </div>
</footer>

<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (id) {
    const post = DB.getPost(id);
    if (post) {
      document.title = post.title + ' — Asaf Ahmad Shayaan';
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-date').textContent = formatDate(post.date);
      document.getElementById('post-content').innerHTML = post.content;
      if (post.tags) {
        document.getElementById('post-tags').textContent = post.tags;
      }
    } else {
      document.getElementById('post-title').textContent = 'Post not found';
    }
  }
</script>
</body>
</html>
